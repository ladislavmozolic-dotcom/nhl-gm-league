# ProfiNHL — one league, live. `docker compose up -d` brings up Postgres, the Next
# app, and Caddy (auto-HTTPS reverse proxy). Data + uploads live in named volumes so
# they SURVIVE every redeploy — you can rebuild the app freely without losing the league.
#
# For a SECOND league later: copy this whole folder, change DOMAIN + DB name/password
# in .env, and `docker compose -p liga2 up -d`.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?Set a random AUTH_SECRET before deployment}
      AUTH_SALT: ${AUTH_SALT:?Set the existing password salt before deployment}
      CRON_SECRET: ${CRON_SECRET}   # protects /api/cron/advance-day (the 20:30 auto-sim trigger)
      RESEND_API_KEY: ${RESEND_API_KEY}   # transactional email (welcome mail on GM approval)
      ALERT_EMAIL: ${ALERT_EMAIL:-}       # ops alerts (pre-sim integrity check) — see scripts/ops
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}    # UNHL Chat web push (empty = push disabled)
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # optional: enables AI "summarize unread" in chat
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}         # optional: enables Gemini 4 Argon / 3.5 Flash GM advisor
      CHAT_SUMMARY_MODEL: ${CHAT_SUMMARY_MODEL:-}  # optional model override (default claude-opus-5-5)
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}   # optional: enables the GIF search tab in chat
      CHAT_ORIGIN: ${CHAT_ORIGIN:-}   # e.g. https://chat.unhl.eu — standalone chat origin (empty = chat stays at /chat on the main site)
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@unhl.eu}
    volumes:
      - uploads:/app/public/uploads   # persist admin-uploaded logos/wordmarks
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads:/srv/uploads:ro   # serve user-uploaded logos/wordmarks directly
      - /opt/mugs:/srv/mugs:ro    # player mug photos (static, host-provided; too big for git)

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
