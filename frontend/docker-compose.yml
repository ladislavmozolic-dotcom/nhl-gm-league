# ProfiNHL — one league, live. `docker compose up -d` brings up Postgres, the Next
# app, and Caddy (auto-HTTPS reverse proxy). Data + uploads live in named volumes so
# they SURVIVE every redeploy — you can rebuild the app freely without losing the league.
#
# For a SECOND league later: copy this whole folder, change DOMAIN + DB name/password
# in .env, and `docker compose -p liga2 up -d`.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    volumes:
      - uploads:/app/public/uploads   # persist admin-uploaded logos/wordmarks
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads:/srv/uploads:ro   # serve user-uploaded logos/wordmarks directly

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
